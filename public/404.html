<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Moon Esports</title>
    <script>
      // GitHub Pages SPA redirect (https://github.com/rafgraph/spa-github-pages)
      // Encodes the requested path into the query string so index.html can restore it.
      // pathSegmentsToKeep = 1 keeps the repo name segment (/moon-esports/).
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
